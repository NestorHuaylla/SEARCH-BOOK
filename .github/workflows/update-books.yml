name: Update book catalog

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-book-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Synchronize providers
        env:
          OPENBOOK_CONTACT_EMAIL: ${{ vars.OPENBOOK_CONTACT_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/update_books.py

      - name: Validate generated catalog
        run: python -m scripts.validate

      - name: Run tests
        run: python -m pytest -q

      - name: Test browser search engine
        run: node --test tests/*.mjs

      - name: Commit changed catalog
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo "Catalog is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json data/metadata.json data/shards
          git commit -m "chore(data): update legal book catalog [skip ci]"
          git push
